name: Actualizar datos

on:
  schedule:
    # Cada 30 minutos. El propio script decide: completa si la última completa fue hace 5 h o más; si no, rápida
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo, rapido o auto'
        required: false
        default: 'completo'

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Recoger datos de todas las plataformas
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SERVER: ${{ vars.MAIL_SERVER }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          ALERT_PREFS: ${{ vars.ALERT_PREFS }}
          FEEDS_EXTRA: ${{ vars.FEEDS_EXTRA }}
          PLAYLISTS_EXTRA: ${{ vars.PLAYLISTS_EXTRA }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          RAPIDO: ${{ github.event_name == 'schedule' && 'auto' || (github.event.inputs.modo == 'rapido' && '1' || (github.event.inputs.modo == 'auto' && 'auto' || '0')) }}
        run: python scripts/update.py

      - name: Guardar los datos nuevos
        run: |
          if git diff --quiet data/data.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "aa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash || true
          git push
